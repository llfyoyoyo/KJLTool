<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酷家乐方案场景查看器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>酷家乐方案查看器</h1>
      <div class="meta" id="meta">未加载方案</div>
      <div class="controls">
        <div class="row">
          <label class="file-btn">
            选择 JSON
            <input id="fileInput" type="file" accept=".json,application/json" />
          </label>
          <button id="fitBtn" type="button">适应视图</button>
        </div>
        <div class="row">
          <label class="check">
            <input id="showHoles" type="checkbox" />
            显示孔位描边
          </label>
        </div>
        <div class="row">
          <label class="check">
            <input id="showSlots" type="checkbox" checked />
            显示布尔开槽
          </label>
        </div>
        <div class="row">
          <button id="showAllBtn" type="button">显示全部节点</button>
        </div>
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="搜索名称/编码/材质/ID…" autocomplete="off" />
          <button id="searchClearBtn" type="button" title="清除搜索" aria-label="清除搜索">×</button>
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="status" id="status">可拖拽 JSON 到画布，或加载默认 6.json</div>
      <div id="tree"></div>
    </aside>
    <main id="viewport">
      <div id="drop-hint">松开以加载 JSON</div>
    </main>
    <aside id="inspector">
      <div class="inspector-header">
        <h2>节点信息</h2>
        <button id="inspectorCloseBtn" type="button" title="清空选中" aria-label="清空选中">×</button>
      </div>
      <div id="inspectorBody" class="inspector-body">
        <div class="inspector-empty">选中左侧树或场景中的节点以查看详情</div>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
